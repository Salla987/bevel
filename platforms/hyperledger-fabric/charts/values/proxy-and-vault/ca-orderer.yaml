#helm install supplychain-ca -f values/proxy-and-vault/ca-server.yaml -n supplychain-net fabric-ca-server
global:
  serviceAccountName: minikube
  cluster:
    provider: minikube
    cloudNativeServices: false
    kubernetesUrl: "https://127.0.0.1:32799"
  vault:
    type: hashicorp
    role: vault-role
    address: http://vault.default.svc.cluster.local:8200
    authPath: supplychain
    secretEngine: secretsv2
    secretPrefix: "data/supplychain"
    tls: false
  proxy:
    provider: haproxy
    externalUrlSuffix: test.192.168.49.2.nip.io

storage:
  size: 512Mi
server:
  removeCertsOnDelete: true
  tlsStatus: true
  adminUsername: supplychain-admin
  adminPassword: supplychain-adminpw
  subject: "/C=GB/ST=London/L=London/O=Orderer"
